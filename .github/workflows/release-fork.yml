name: Release (fork)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: tag to release (e.g. v0.7.1)
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-15
            name: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-15
            name: herdr-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            name: herdr-windows-x86_64.zip

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\${{ matrix.target }}\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: master
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            herdr-linux-x86_64/herdr-linux-x86_64
            herdr-linux-aarch64/herdr-linux-aarch64
            herdr-macos-x86_64/herdr-macos-x86_64
            herdr-macos-aarch64/herdr-macos-aarch64
            herdr-windows-x86_64.zip/herdr-windows-x86_64.zip

      - name: Update latest.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/aceitw/herdr/releases/download/${TAG}"
          export SHA_LINUX_X86_64="$(sha256sum herdr-linux-x86_64/herdr-linux-x86_64 | awk '{print $1}')"
          export SHA_LINUX_AARCH64="$(sha256sum herdr-linux-aarch64/herdr-linux-aarch64 | awk '{print $1}')"
          export SHA_MACOS_X86_64="$(sha256sum herdr-macos-x86_64/herdr-macos-x86_64 | awk '{print $1}')"
          export SHA_MACOS_AARCH64="$(sha256sum herdr-macos-aarch64/herdr-macos-aarch64 | awk '{print $1}')"
          export SHA_WINDOWS_X86_64="$(sha256sum herdr-windows-x86_64.zip/herdr-windows-x86_64.zip | awk '{print $1}')"
          python3 - <<EOF
          import json, os, re
          with open('latest.json') as f:
              manifest = json.load(f)
          manifest['version'] = '${VERSION}'
          manifest['protocol'] = 22
          manifest['endpoint_generation'] = 1
          manifest['assets'] = {
              'linux-x86_64':  '${BASE}/herdr-linux-x86_64',
              'linux-aarch64': '${BASE}/herdr-linux-aarch64',
              'macos-x86_64':  '${BASE}/herdr-macos-x86_64',
              'macos-aarch64': '${BASE}/herdr-macos-aarch64',
              'windows-x86_64': '${BASE}/herdr-windows-x86_64.zip',
          }
          manifest['sha256'] = {
              'linux-x86_64': os.environ['SHA_LINUX_X86_64'],
              'linux-aarch64': os.environ['SHA_LINUX_AARCH64'],
              'macos-x86_64': os.environ['SHA_MACOS_X86_64'],
              'macos-aarch64': os.environ['SHA_MACOS_AARCH64'],
              'windows-x86_64': os.environ['SHA_WINDOWS_X86_64'],
          }
          # The updater shows this section to users on `herdr update`, so the
          # released version must carry its own notes. Fall back to the previous
          # notes rather than block a release on a changelog miss.
          previous_notes = manifest['notes']
          section = None
          if os.path.exists('CHANGELOG.md'):
              with open('CHANGELOG.md') as f:
                  changelog = f.read()
              match = re.search(
                  r'(?ms)^## \[' + re.escape('${VERSION}') + r'\][^\n]*\n(.*?)(?=^## \[|\Z)',
                  changelog,
              )
              if match:
                  section = match.group(1).strip() or None
          if section:
              manifest['notes'] = section
              manifest['releases']['${VERSION}'] = {
                  'notes': section,
                  'protocol': manifest['protocol'],
                  'assets': dict(manifest['assets']),
                  'sha256': dict(manifest['sha256']),
              }
          else:
              print("warning: CHANGELOG.md has no section for ${VERSION}; keeping previous notes")
          # Keep the checked-in distribution manifest identical: the updater
          # schema test validates distribution/latest.json, and this repo's
          # installer reads latest.json. Drift between the two would make the
          # test pass on stale content.
          with open('latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          with open('distribution/latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          EOF

      - name: Commit latest.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json distribution/latest.json
          git diff --cached --quiet || git commit -m "docs: update latest.json for v${VERSION}"
          git push origin master
